# =============================================================================
# Google Cloud Build pipeline for Maintenance Wizard
# -----------------------------------------------------------------------------
# Usage (one-shot deploy):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_GEMINI_KEY=YOUR_GEMINI_KEY,_REGION=asia-southeast1
# =============================================================================

steps:
  # 1. Build the multi-stage Docker image.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/maintenance-wizard:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/maintenance-wizard:latest'
      - '.'

  # 2. Push both the SHA-tagged and the :latest tag to GCR.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/maintenance-wizard']

  # 3. Deploy to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'maintenance-wizard'
      - '--image=gcr.io/$PROJECT_ID/maintenance-wizard:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production,GEMINI_API_KEY=${_GEMINI_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/maintenance-wizard:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/maintenance-wizard:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _GEMINI_KEY: ''                # Override: --substitutions=_GEMINI_KEY=...
  _REGION: 'asia-southeast1'     # Override: --substitutions=_REGION=us-central1

timeout: '1800s'

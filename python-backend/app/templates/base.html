<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maintenance Wizard - Agentic AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="inline-block w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-blue-600"></span>
        <span class="font-semibold tracking-tight">Maintenance Wizard</span>
        <span class="text-xs bg-emerald-100 text-emerald-700 rounded px-2 py-0.5 font-medium">Agentic AI</span>
      </a>
      <nav class="text-sm flex gap-5">
        <a href="/" class="hover:text-emerald-700">Overview</a>
        <a href="/dashboard" class="hover:text-emerald-700">Command Center</a>
        <a href="/judges" class="hover:text-emerald-700">Judges' Alignment</a>
        <a href="/health" class="hover:text-emerald-700">Health</a>
      </nav>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6">{% block content %}{% endblock %}</main>
  <footer class="text-xs text-slate-400 text-center py-6">
    Built for the Tata Steel Agentic AI Hackathon - single-container Cloud Run deploy
  </footer>
</body>
</html>

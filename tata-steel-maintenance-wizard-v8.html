.kbd{font-family:'JetBrains Mono',monospace;background:#0a0f24;border:1px solid #2A3566;border-radius:6px;padding:2px 6px;font-size:11px;color:#9DB6FF;}

.tab-active{background:#1E4FD9 !important;color:#fff;border-color:#2E5FF0 !important;}
.pulse{animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.node{cursor:pointer;transition:transform .15s;}
.node:hover{transform:translateY(-2px);}
.edge{stroke:#3F52A0;stroke-width:1.5;fill:none;}
.edge-active{stroke:#FFA300;stroke-width:2.5;}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.citation{display:inline-block;background:rgba(0,51,160,.35);border:1px solid #2E5FF0;color:#9DB6FF;font-family:'JetBrains Mono',monospace;font-size:10px;padding:1px 6px;border-radius:6px;margin:0 2px;cursor:pointer;}
.citation:hover{background:#2E5FF0;color:white;}
.bar{height:8px;background:#0a0f24;border-radius:4px;overflow:hidden;}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#1E4FD9,#5EE0A8);}
.skel{background:linear-gradient(90deg,#161E40,#1F2A5C,#161E40);background-size:200% 100%;animation:skel 1.2s linear infinite;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.typing::after{content:'▌';animation:blink 1s steps(1) infinite;color:#FFA300}
@keyframes blink{50%{opacity:0}}

<script>
const $ = sel => document.querySelector(sel);
const el = (tag, attrs={}, ...kids)=>{
 const n=document.createElement(tag);
 Object.entries(attrs).forEach(([k,v])=>{
   if(k==="class") n.className=v;
   else if(k==="html") n.innerHTML=v;
   else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
   else n.setAttribute(k,v);
 });
 kids.flat().forEach(k=> k!=null && n.append(k.nodeType?k:document.createTextNode(k)));
 return n;
};
const statusChip = s => {
 const map={Healthy:"chip-green",Warning:"chip-amber",Critical:"chip-red"};
 return `<span class="chip ${map[s]}">${s}</span>`;
};

document.querySelectorAll("#tabs button").forEach(b=>{

TABS.dashboard = (root)=>{
 const grid = el("div",{class:"grid grid-cols-12 gap-5"});
 // KPI strip
 const kpis = el("div",{class:"col-span-12 grid grid-cols-2 md:grid-cols-5 gap-3"});
 [
  {l:"Assets monitored", v:ASSETS.length, c:"chip-blue"},
  {l:"Critical now",     v:ASSETS.filter(a=>a.status==="Critical").length, c:"chip-red"},
  {l:"Warnings",         v:ASSETS.filter(a=>a.status==="Warning").length,  c:"chip-amber"},
  {l:"Healthy",          v:ASSETS.filter(a=>a.status==="Healthy").length,  c:"chip-green"},
  {l:"Avg MTTR ↓",       v:"−38%", c:"chip-violet"},
 ].forEach(k=>{
   kpis.append(el("div",{class:"card p-4"},
     el("div",{class:"text-xs text-[#9AA6C7] mb-1"}, k.l),
     el("div",{class:"text-2xl font-bold"}, String(k.v)),
     el("div",{class:"mt-2",html:`<span class="chip ${k.c}">monitored</span>`})
   ));
 });
 grid.append(kpis);

 // Asset table
 const table = el("div",{class:"col-span-12 lg:col-span-8 card p-5"});
 table.append(el("div",{class:"flex items-center justify-between mb-3"},
   el("div",{class:"font-bold"}, "Critical Asset Telemetry · live"),
   el("div",{class:"text-xs text-[#9AA6C7] mono"}, "refresh 2s")
 ));
 const tbl = el("table",{class:"w-full text-sm"});
 tbl.innerHTML = `
   <thead class="text-[#9AA6C7] text-xs">
     <tr><th class="text-left py-2">Asset</th><th>Area</th><th>Temp</th><th>Vib(mm/s)</th><th>Press</th><th>RUL(d)</th><th>Status</th><th></th></tr>
   </thead><tbody id="assetBody"></tbody>`;
 table.append(tbl);
 grid.append(table);

 // Alerts panel
 const alerts = el("div",{class:"col-span-12 lg:col-span-4 card p-5"});
 alerts.append(el("div",{class:"font-bold mb-3"}, "Active Alerts (role-filtered)"));
 ALERTS.forEach(a=>{
   const cl = a.sev==="Critical" ? "chip-red" : "chip-amber";
   alerts.append(el("div",{class:"border-l-4 pl-3 py-2 mb-2", style:`border-color:${a.sev==='Critical'?'#D7263D':'#FFA300'}`},
     el("div",{class:"flex items-center gap-2"},
       el("span",{class:`chip ${cl}`}, a.sev),
       el("span",{class:"text-xs text-[#9AA6C7] mono"}, `${a.time} · ${a.id}`)
     ),
     el("div",{class:"text-sm mt-1"}, a.msg),
     el("div",{class:"text-[11px] text-[#9DB6FF] mt-1"}, "→ " + a.role.join(", "))
   ));
 });
 grid.append(alerts);

 // Chart card
 const chartCard = el("div",{class:"col-span-12 card p-5"});
 chartCard.append(el("div",{class:"font-bold mb-3"}, "Vibration Trend · HSM-1 (24h, predictive band)"));
 const cv = el("canvas",{id:"trendChart",style:"height:240px;max-height:240px"});
 chartCard.append(cv);
 grid.append(chartCard);

 root.append(grid);

 // populate asset rows
 const body = $("#assetBody");
 ASSETS.forEach(a=>{
   body.append(el("tr",{class:"border-t border-[#2A3566]"},
     el("td",{class:"py-2 font-semibold"}, a.id+" · "+a.name),
     el("td",{class:"text-[#9AA6C7]"}, a.area),
     el("td",{class:"mono"}, a.temp+"°C"),
     el("td",{class:"mono"}, a.vib.toFixed(1)),
     el("td",{class:"mono"}, a.press),
     el("td",{class:"mono"}, a.rul),
     el("td",{html: statusChip(a.status)}),
     el("td",{}, el("button",{class:"btn", onclick:()=>{document.querySelector('[data-tab=diagnose]').click(); setTimeout(()=>runDiagnose(a.id),50);}}, "Diagnose →"))
   ));
 });

 // chart
 setTimeout(()=>{
   const labels = Array.from({length:24},(_,i)=>`${i}:00`);
   const data   = labels.map((_,i)=> 4.2 + i*0.11 + (Math.sin(i/2)*0.4));
   const ub     = data.map(x=>x+0.9);
   const lb     = data.map(x=>Math.max(0,x-0.9));
   new Chart(cv,{
     type:"line",
     data:{labels,datasets:[
       {label:"Vibration mm/s", data, borderColor:"#FFC15A",backgroundColor:"rgba(255,193,90,.15)",fill:false,tension:.3,pointRadius:0,borderWidth:2},
       {label:"Predicted upper", data:ub, borderColor:"rgba(215,38,61,.6)",borderDash:[6,4],pointRadius:0,fill:'+1',backgroundColor:"rgba(215,38,61,.08)"},
       {label:"Predicted lower", data:lb, borderColor:"rgba(94,224,168,.6)",borderDash:[6,4],pointRadius:0,fill:false},
       {label:"OEM trip 10 mm/s", data:labels.map(()=>10), borderColor:"#D7263D",borderDash:[2,2],pointRadius:0,borderWidth:1},
       {label:"OEM alarm 7 mm/s", data:labels.map(()=>7),  borderColor:"#FFA300",borderDash:[2,2],pointRadius:0,borderWidth:1},
     ]},
     options:{responsive:true,maintainAspectRatio:false,
       plugins:{legend:{labels:{color:"#E7ECF7",font:{size:11}}}},
       scales:{x:{ticks:{color:"#9AA6C7"},grid:{color:"#1F2A5C"}},y:{ticks:{color:"#9AA6C7"},grid:{color:"#1F2A5C"},min:0,max:12}}
     }
   });
 },50);
};

async function runDiagnose(assetId){
 const asset = ASSETS.find(a=>a.id===assetId);
 if(!asset) return;
 const out = $("#diagOut") || (() => {document.querySelector('[data-tab=diagnose]').click(); return $("#diagOut");})();
 if(!out) return;
 out.innerHTML = "";

 const header = el("div",{class:"mb-4"},
   el("div",{class:"flex items-center gap-2 flex-wrap"},
     el("div",{class:"font-bold text-lg"}, `${asset.id} — ${asset.name}`),
     el("span",{html:statusChip(asset.status)}),
     el("span",{class:"chip chip-blue"}, asset.area),
     el("span",{class:"chip chip-violet"}, "5 agents · streaming")
   ),
   el("div",{class:"text-xs text-[#9AA6C7] mt-1 mono"}, `Telemetry → temp ${asset.temp}°C · vib ${asset.vib} mm/s · press ${asset.press} · RUL est ${asset.rul} d`)
 );
 out.append(header);

 const steps = el("div",{class:"space-y-3"});
 out.append(steps);

 const agentSteps = buildAgentSteps(asset);
 lastDiagnosis = {asset, agentSteps};

 for(const s of agentSteps){
   const card = el("div",{class:"border border-[#2A3566] rounded-xl p-4 bg-[#0e1430]"});
   const head = el("div",{class:"flex items-center gap-2 mb-2"},
     el("div",{class:"w-7 h-7 rounded-md flex items-center justify-center font-bold",style:`background:${s.color}25;color:${s.color};border:1px solid ${s.color}`}, s.icon),
     el("div",{class:"font-semibold"}, s.agent),
     el("span",{class:"chip chip-blue mono",style:"font-size:10px"}, "conf "+(s.confidence*100).toFixed(0)+"%"),
     el("span",{class:"chip chip-violet mono",style:"font-size:10px"}, s.latency+" ms")
   );
   card.append(head);
   const body = el("div",{class:"text-sm leading-relaxed typing"});
   card.append(body);
   steps.append(card);
   await typeInto(body, s.text);
   body.classList.remove("typing");
   if(s.citations && s.citations.length){
     const cits = el("div",{class:"mt-2 flex flex-wrap gap-1"});
     s.citations.forEach(c=>{
       const chip = el("span",{class:"citation", title:c.title}, c.id);
       chip.addEventListener("click",()=>openCitation(c.id));
       cits.append(chip);
     });
     card.append(cits);
   }
   if(s.evidence){
     const det = el("details",{class:"mt-2"});
     det.append(el("summary",{class:"text-[11px] text-[#9DB6FF] mono"}, "▸ show raw evidence / reasoning trace"));
     det.append(el("pre",{class:"mt-2 text-[11px] mono bg-[#0a0f24] border border-[#2A3566] rounded p-3 whitespace-pre-wrap"}, s.evidence));
     card.append(det);
   }
 }

 // Final recommendation card
 const reco = buildRecommendation(asset);
 const card = el("div",{class:"border border-[#FFA300] rounded-xl p-4 bg-[#1a1208]"});
 card.append(el("div",{class:"font-bold text-[#FFC15A] mb-2"}, "🎯 Recommended Action Plan"));
 reco.forEach((r,i)=>{
   card.append(el("div",{class:"flex gap-3 py-1"},
     el("div",{class:"mono text-[#FFC15A] w-6"}, (i+1)+"."),
     el("div",{class:"flex-1 text-sm"}, r.action),
     el("span",{class:"chip chip-blue mono",style:"font-size:10px"}, r.who),
     el("span",{class:"chip chip-amber mono",style:"font-size:10px"}, r.eta)
   ));
 });
 const acts = el("div",{class:"mt-3 flex flex-wrap gap-2"});
 acts.append(
   el("button",{class:"btn btn-primary",onclick:()=>{document.querySelector('[data-tab=rmap]').click();}}, "🕸️ View Reasoning Map"),
   el("button",{class:"btn",onclick:()=>{document.querySelector('[data-tab=mpi]').click();}}, "📐 Show MPI Transparency"),
   el("button",{class:"btn",onclick:()=>{document.querySelector('[data-tab=spares]').click();}}, "🔩 Stage Spares"),
   el("button",{class:"btn",onclick:()=>{document.querySelector('[data-tab=logbook]').click();}}, "📒 Log to Shift Book")
 );
 card.append(acts);
 out.append(card);
}

function typeInto(node,text){
 return new Promise(res=>{
   let i=0;
   const speed = Math.max(4, Math.floor(800/text.length));
   const t = setInterval(()=>{
     node.textContent = text.slice(0,i+=3);
     if(i>=text.length){clearInterval(t); node.textContent=text; res();}
   }, speed);
 });
}

function openCitation(id){
 const doc = KB.find(d=>d.id===id);
 if(!doc) return;
 const ov = el("div",{class:"fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4", onclick:e=>{if(e.target===ov)ov.remove();}});
 const card = el("div",{class:"card max-w-2xl w-full p-6 glow"});
 card.append(
   el("div",{class:"flex items-center gap-2 mb-3 flex-wrap"},
     el("span",{class:"chip chip-blue mono"}, doc.id),
     el("span",{class:"chip chip-violet"}, doc.category),
     el("span",{class:"chip chip-amber"}, "asset: "+doc.asset)),
   el("div",{class:"font-bold text-lg mb-2"}, doc.title),
   el("div",{class:"text-sm leading-relaxed text-[#E7ECF7]"}, doc.content),
   el("div",{class:"mt-4 text-right"}, el("button",{class:"btn",onclick:()=>ov.remove()}, "Close"))
 );
 ov.append(card);
 document.body.append(ov);
}

 const ta = el("input",{type:"text",class:"flex-1 bg-[#0a0f24] border border-[#2A3566] rounded-lg p-2 text-sm",placeholder:"Ask anything · e.g. 'What is wrong with HSM-1?' or 'How do I replace the mill bearing?'"});
 const send = el("button",{class:"btn btn-primary"}, "Send ⏎");
 inputRow.append(ta,send);
 left.append(inputRow);
 wrap.append(left);

 const right = el("div",{class:"col-span-12 lg:col-span-4 card p-4"});
 right.append(el("div",{class:"font-bold mb-3"}, "Try these"));
 [
  "What is wrong with HSM-1 right now?",
  "Show SOP for HSM-1 bearing replacement",
  "Why is SIN-2 critical and what should we do?",
  "Do we have spare bearings in stock?",
  "What does IS 14489 require for this job?",
  "Compare current vibration trend with the 2023 incident",
 ].forEach(q=>{
   right.append(el("button",{class:"btn w-full text-left mb-2",style:"font-weight:500", onclick:()=>{ta.value=q;send.click();}}, q));
 });
 right.append(el("div",{class:"mt-4 text-xs text-[#9AA6C7]"},
   "Every answer is grounded in retrieved corpus and shows clickable citations like ",
   el("span",{class:"citation"}, "SOP-001"), " — click a citation to inspect the source passage."));
 wrap.append(right);

 root.append(wrap);

 // restore history
 CHAT_HISTORY.forEach(m=>renderMsg(m));

 const sendMsg = async ()=>{
   const q = ta.value.trim(); if(!q) return; ta.value="";
   const um = {role:"user",text:q};
   CHAT_HISTORY.push(um); renderMsg(um);
   const am = {role:"assistant",text:"", citations:[], thinking:true};
   CHAT_HISTORY.push(am);
   const node = renderMsg(am);
   const reply = answerRAG(q);
   await new Promise(r=>setTimeout(r,250));
   am.thinking=false;
   am.text=reply.text; am.citations=reply.citations;
   node.replaceWith(renderMsg(am, true));
 };
 send.addEventListener("click",sendMsg);
 ta.addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg();});
};

function renderMsg(m, replace=false){
 const log = $("#chatLog");
 const node = el("div",{class:"flex gap-3 "+(m.role==="user"?"justify-end":"")});
 if(m.role==="assistant"){
   node.append(el("div",{class:"w-8 h-8 rounded-full flex items-center justify-center font-bold bg-gradient-to-br from-[#0033A0] to-[#1E4FD9] flex-shrink-0"}, "AI"));
 }
 const bubble = el("div",{class:(m.role==="user"
   ?"bg-[#1E4FD9] text-white"
   :"bg-[#0e1430] border border-[#2A3566]")+" rounded-2xl px-4 py-3 max-w-[80%]"});
 if(m.thinking){
   bubble.append(el("div",{class:"flex gap-1"},
     el("div",{class:"w-2 h-2 bg-[#9DB6FF] rounded-full pulse"}),
     el("div",{class:"w-2 h-2 bg-[#9DB6FF] rounded-full pulse",style:"animation-delay:.2s"}),
     el("div",{class:"w-2 h-2 bg-[#9DB6FF] rounded-full pulse",style:"animation-delay:.4s"})
   ));
 } else {
   const md = el("div",{class:"text-sm leading-relaxed whitespace-pre-wrap"});
   md.innerHTML = renderInlineCitations(m.text);
   bubble.append(md);
   if(m.citations && m.citations.length){
     const c = el("div",{class:"mt-2 flex flex-wrap gap-1"});
     m.citations.forEach(id=>{
       const chip = el("span",{class:"citation"}, id);
       chip.addEventListener("click",()=>openCitation(id));
       c.append(chip);
     });
     bubble.append(c);
   }
 }
 node.append(bubble);
 if(m.role==="user"){
   node.append(el("div",{class:"w-8 h-8 rounded-full flex items-center justify-center font-bold bg-[#7A4A00] flex-shrink-0"}, "U"));
 }
 log.append(node);
 // wire inline citation clicks
 node.querySelectorAll(".citation").forEach(c=>{
   c.addEventListener("click",()=>openCitation(c.textContent.trim()));
 });
 log.scrollTop = log.scrollHeight;
 return node;
}

function renderInlineCitations(text){
 return text.replace(/\[([A-Z]+-\d+)\]/g, (_,id)=> `<span class="citation">${id}</span>`);
}

function answerRAG(q){
 const lower = q.toLowerCase();
 // simple intent routing — would be LLM+retriever in production
 if(/hsm|hot strip|bearing.*hsm|wrong.*hsm/.test(lower)){
   return {
     text:`HSM-1 is showing a progressive bearing failure signature. Vibration has climbed from 4.3 to 6.8 mm/s in the last 9 days; bearing temperature is 78 °C (OEM alarm 90 °C, trip 100 °C per the SMS Demag datasheet) [OEM-009]. The 1X/2X harmonic ratio of 1.6 indicates imbalance — consistent with stage-3 outer-race spalling.

This pattern is **almost identical** to the 2023-08-14 incident which led to a 14-hour seizure and 38,400 t of lost production [HIST-441]. The root cause then was that the spare bearing was not staged. We currently have **zero on-hand** of part 23264-CAK/W33 [SPARE-22].

**Recommendation:**
1. Raise RFQ today for the qualified alternate SKF 23264-CC/W33 (lead 18 d, ₹14.2 L) [SPARE-22].
2. Plan a 14-hour outage at the next campaign change per [SOP-001].
3. Issue LOTO & permit-to-work per [REG-IS].

Confidence: 89 % · RUL 9 d ± 3.`,
     citations:["OEM-009","HIST-441","SPARE-22","SOP-001","REG-IS"]
   };
 }
 if(/sop.*hsm|replace.*bearing|how.*replace/.test(lower)){
   return {
     text:`The HSM-1 bearing replacement procedure is in [SOP-001] (Rev 4.2). Key steps:

1. **Lockout-tagout per IS 14489** — double-isolation, signed permit-to-work [REG-IS]
2. **Hydraulic depressurisation** to <5 bar; cooling water isolation
3. **Removal** using puller P-220 with 60-ton hydraulic ram
4. **Inspection** — reject race if spalling depth >0.4 mm
5. **Reinstallation** — torque sequence 1-3-5-2-4 at 850 Nm
6. **Lubrication** — Mobilith SHC 460
7. **Estimated downtime**: 14 hours with a 4-person crew

The OEM trip/alarm limits (vib 7/10 mm/s, temp 90 °C) are in [OEM-009].`,
     citations:["SOP-001","REG-IS","OEM-009"]
   };
 }
 if(/sin|sinter|fan/.test(lower)){
   return {
     text:`Sinter Plant Fan #2 is at 9.2 mm/s vibration — that's ISO-10816-3 **zone C**, which per the OEM vibration spectrum atlas mandates a planned outage within 7 days [MAN-014]. The 1X-dominant spectrum with phase rotation indicates blade-mass asymmetry from deposit fouling.

The signature matches incident 2024-02-22, which escalated to a catastrophic blade fracture costing ₹4.1 Cr [HIST-512]. We have **one** spare blade assembly HF-BL-2200 in stock (policy minimum is 2) [SPARE-31].

**Action:** drop fan load 15 % immediately, plan 48-hour outage, re-order one set today.

Confidence: 92 % · RUL 4 d ± 2.`,
     citations:["MAN-014","HIST-512","SPARE-31"]
   };
 }
 if(/spare|stock|inventory|bearing.*stock/.test(lower)){
   return {
     text:`Current spare-parts position for critical assets:

• **Bearing 23264-CAK/W33** (HSM-1): on-hand **0**, OEM lead 11 d air / 28 d sea, cost ₹14.2 L; qualified alternate SKF lead 18 d [SPARE-22] — **stock-out risk: HIGH**
• **Sinter Fan Blade Assy HF-BL-2200** (SIN-2): on-hand **1** vs. policy 2, lead 45 d, cost ₹38 L [SPARE-31] — **below minimum policy**

Both items should be re-ordered today.`,
     citations:["SPARE-22","SPARE-31"]
   };
 }
 if(/is.?14489|loto|permit|safety/.test(lower)){
   return {
     text:`IS 14489:2018 governs LOTO and permit-to-work in Indian factories [REG-IS]. It requires:

1. **Signed permit-to-work** for hot/cold/confined-space jobs
2. **Double-isolation** of energy sources
3. **Energy verification** (zero-energy state confirmed)
4. **Photographic record** of isolation points

For HSM-1 bearing replacement, this is mandatory before any mechanical work begins per [SOP-001].`,
     citations:["REG-IS","SOP-001"]
   };
 }
 if(/2023|incident|history|compare/.test(lower)){
   return {
     text:`The 2023-08-14 HSM-1 incident [HIST-441]: vibration reached 8.9 mm/s and the bearing seized after a 9-day warning period. The warning **was** acknowledged but **not actioned** because the spare wasn't staged (procurement lead 11 d). Lost production: **38,400 t**.

Today's signature is mid-way through the same pattern — vibration slope +0.27 mm/s/day from a similar starting point. If we follow the 2023 trajectory we hit 8.9 mm/s in ≈8 days. The corrective action defined after 2023 was "minimum 1 staged spare" — yet [SPARE-22] shows **on-hand = 0**. Closing that gap today is the highest-leverage action.`,
     citations:["HIST-441","SPARE-22"]
   };
 }
 // generic fallback
 return {
   text:`I don't have a high-confidence match in the corpus for that question, but here's what's relevant right now:
• HSM-1 is Critical — bearing trending to OEM limits [OEM-009]
• SIN-2 is Critical — fan in ISO-10816 zone C [MAN-014]
• BF-3 has a Warning on stave cooling [SOP-002]

Ask me about any of these or about spares, SOPs, or safety regulations.`,
   citations:["OEM-009","MAN-014","SOP-002"]
 };
}

     el("span",{class:"chip chip-blue ml-1"}, "Predictive accuracy"),

     `MPI = 0.35 · F1\n    + 0.20 · AUC\n    + 0.15 · Coverage\n    + 0.15 · (1 − Brier)\n    + 0.15 · OpImpact\n\nwhere\n  F1        = harmonic mean of precision & recall on hold-out\n  AUC       = ROC-AUC on AI4I-2020 + Tata plant test set\n  Coverage  = % anomalies with ≥3 retrieved citations\n  Brier     = mean squared probability error\n  OpImpact  = normalised MTTR reduction vs 2024 baseline\n\nAll five sub-scores are stored per decision in the\nimmutable audit log and can be reproduced from raw\ntelemetry + corpus snapshot.`)

TABS.spares = (root)=>{

 ));

 const spares = [
  {pn:"23264-CAK/W33",  desc:"Spherical roller bearing (SMS Demag)", asset:"HSM-1",  onhand:0, policy:1, lead:18, cost:"₹14.2 L",  pfail:0.71, crit:"A", action:"RAISE-RFQ-NOW"},

  {pn:"GSK-COG-204",    desc:"Coke-oven gas-compressor strainer kit", asset:"COG-1",  onhand:3, policy:2, lead:7,  cost:"₹0.6 L",   pfail:0.22, crit:"B", action:"OK"},
  {pn:"BF-STAVE-12",    desc:"Cooling stave (Cu)",                    asset:"BF-3",   onhand:1, policy:1, lead:60, cost:"₹22 L",    pfail:0.18, crit:"A", action:"MONITOR"},

 const table = el("table",{class:"w-full text-sm"});
 table.innerHTML = `<thead class="text-[#9AA6C7] text-xs"><tr>
   <th class="text-left py-2">Part / Desc</th><th>Asset</th><th>Crit</th><th>On-hand / Policy</th><th>P(fail)</th><th>Lead</th><th>Cost</th><th>Priority</th><th>Action</th></tr></thead>`;
 const tb = el("tbody");
 spares.forEach(s=>{
   const aClass = s.action==="RAISE-RFQ-NOW" ? "chip-red" : s.action==="REORDER" ? "chip-amber" : s.action==="MONITOR" ? "chip-blue" : "chip-green";
   tb.append(el("tr",{class:"border-t border-[#2A3566]"},
     el("td",{class:"py-2"},
       el("div",{class:"font-semibold mono"}, s.pn),
       el("div",{class:"text-xs text-[#9AA6C7]"}, s.desc)),
     el("td",{class:"mono"}, s.asset),
     el("td",{}, el("span",{class:"chip "+(s.crit==="A"?"chip-red":s.crit==="B"?"chip-amber":"chip-green")}, s.crit)),
     el("td",{class:"mono "+(s.onhand<s.policy?"text-[#FF8195]":"")}, s.onhand+" / "+s.policy),
     el("td",{class:"mono"}, (s.pfail*100).toFixed(0)+"%"),
     el("td",{class:"mono"}, s.lead+" d"),
     el("td",{class:"mono"}, s.cost),
     el("td",{}, el("div",{class:"flex items-center gap-2"},
       el("div",{class:"bar w-16"}, el("span",{style:`width:${Math.min(100,s.priority)}%`})),
       el("span",{class:"mono"}, s.priority.toFixed(0)))),
     el("td",{}, el("span",{class:"chip "+aClass}, s.action))
   ));
 });
 table.append(tb);
 tbl.append(table);
 wrap.append(tbl);

 root.append(wrap);
};

/* ===================================================== */
/* TAB 7 — ROLE-BASED LOGBOOK                             */
/* ===================================================== */
TABS.logbook = (root)=>{
 const wrap = el("div",{class:"grid grid-cols-12 gap-5"});

 // role filter
 const ctrl = el("div",{class:"col-span-12 card p-4 flex items-center gap-3 flex-wrap"});
 ctrl.append(el("span",{class:"font-bold"}, "View as role:"));
 const allBtn = el("button",{class:"btn tab-active",onclick:()=>filter(null)}, "All");
 ctrl.append(allBtn);
 const roleBtns = {};
 ROLES.forEach(r=>{
   const b = el("button",{class:"btn",onclick:()=>filter(r)}, r);
   roleBtns[r]=b; ctrl.append(b);
 });
 wrap.append(ctrl);

 // alerts panel
 const aP = el("div",{class:"col-span-12 lg:col-span-5 card p-5"});
 aP.append(el("div",{class:"font-bold mb-3"}, "Routed Alerts"));
 const aBody = el("div",{id:"alertList"});
 aP.append(aBody);
 wrap.append(aP);

 // logbook
 const lP = el("div",{class:"col-span-12 lg:col-span-7 card p-5"});
 lP.append(el("div",{class:"flex items-center justify-between mb-3"},
   el("div",{class:"font-bold"}, "Digital Shift Logbook (immutable, append-only)"),
   el("button",{class:"btn btn-primary text-xs",onclick:()=>addLog()}, "+ Add entry")
 ));
 const lBody = el("div",{id:"logList"});
 lP.append(lBody);
 wrap.append(lP);

 root.append(wrap);

 const state = {role:null};
 function filter(r){
   state.role = r;
   Object.values(roleBtns).forEach(b=>b.classList.remove("tab-active"));
   allBtn.classList.toggle("tab-active", r===null);
   if(r && roleBtns[r]) roleBtns[r].classList.add("tab-active");
   refresh();
 }
 function refresh(){
   aBody.innerHTML = "";
   const alerts = state.role ? ALERTS.filter(a=>a.role.includes(state.role)) : ALERTS;
   alerts.forEach(a=>{
     const cl = a.sev==="Critical"?"chip-red":"chip-amber";
     aBody.append(el("div",{class:"border-l-4 pl-3 py-2 mb-3",style:`border-color:${a.sev==='Critical'?'#D7263D':'#FFA300'}`},
       el("div",{class:"flex items-center gap-2 flex-wrap"},
         el("span",{class:`chip ${cl}`}, a.sev),
         el("span",{class:"chip chip-blue mono",style:"font-size:10px"}, a.id),
         el("span",{class:"text-xs text-[#9AA6C7] mono"}, a.time),
         el("span",{class:"chip chip-violet"}, a.asset)),
       el("div",{class:"text-sm mt-1"}, a.msg),
       el("div",{class:"text-[11px] text-[#9DB6FF] mt-1"}, "Routed to: " + a.role.join(" · "))
     ));
   });
   if(!alerts.length) aBody.append(el("div",{class:"text-sm text-[#9AA6C7]"}, "No alerts for this role."));

   lBody.innerHTML = "";
   const logs = state.role ? LOGBOOK.filter(l=>l.role===state.role) : LOGBOOK;
   logs.forEach(l=>{
     lBody.append(el("div",{class:"border border-[#2A3566] rounded-lg p-3 mb-2"},
       el("div",{class:"flex items-center gap-2 flex-wrap text-xs"},
         el("span",{class:"chip chip-blue"}, l.role),
         el("span",{class:"text-[#9AA6C7] mono"}, l.ts),
         el("span",{class:"chip chip-violet"}, l.asset),
         el("span",{class:"chip "+(l.outcome==='OK'||l.outcome==='Closed'||l.outcome==='Effective'?'chip-green':'chip-amber')}, l.outcome)),
       el("div",{class:"text-sm mt-1"}, l.user+" — "+l.action)
     ));
   });
 }
 window.addLog = ()=>{
   const action = prompt("Describe the action taken:");
   if(!action) return;
   LOGBOOK.unshift({
     ts:new Date().toISOString().replace("T"," ").slice(0,16),
     role: state.role || "Operator",
     user:"You (demo)",
     asset:"HSM-1",
     action,
     outcome:"pending"
   });
   refresh();
 };
 refresh();
};

/* ===================================================== */
/* TAB 8 — FINE-TUNE CARD                                 */
/* ===================================================== */
TABS.model = (root)=>{
 const wrap = el("div",{class:"grid grid-cols-12 gap-5"});

 wrap.append(el("div",{class:"col-span-12 lg:col-span-7 card p-5"},
   el("div",{class:"flex items-center gap-2 mb-3"},
     el("div",{class:"font-bold text-lg"}, "phi-3.5-steel-ft"),
     el("span",{class:"chip chip-violet"}, "LoRA r=16, α=32"),
     el("span",{class:"chip chip-green"}, "fp16 · 7.3 GB"),
     el("span",{class:"chip chip-blue"}, "rev 0414")
   ),
   el("div",{class:"text-sm text-[#9AA6C7] mb-4"},
     "Domain-adapted fine-tune of Microsoft Phi-3.5-mini-instruct (3.8 B). LoRA adapters target the q/k/v + MLP projections. Trained on labelled steel-plant maintenance events combining the public AI4I-2020 dataset with Tata Steel Kalinganagar plant historical logs (2019-2025)."),
   el("div",{class:"grid grid-cols-2 gap-3 text-sm"},
     fitem("Base model","microsoft/Phi-3.5-mini-instruct (3.8 B)"),
     fitem("Adapter","LoRA r=16, α=32, dropout=0.05"),
     fitem("Training samples","12,418 labelled events"),
     fitem("Train / Val / Test split","80 / 10 / 10"),
     fitem("Epochs","3"),
     fitem("Effective batch","32 (4×8 grad-accum)"),
     fitem("Optimiser","AdamW 8-bit, lr=2e-4 cosine"),
     fitem("Hardware","1× A100 80GB · 4h 12m"),
     fitem("Final eval loss","0.341"),
     fitem("Macro-F1 (5 failure modes)","0.91"),
     fitem("Hallucination rate (RAG-on)","< 0.7 %"),
     fitem("License","MIT (adapter), Phi-3.5 MIT (base)"),
   )
 ));

 wrap.append(el("div",{class:"col-span-12 lg:col-span-5 card p-5"},
   el("div",{class:"font-bold mb-2"}, "Training data composition"),
   el("canvas",{id:"dsChart",style:"height:240px;max-height:240px"})
 ));

 wrap.append(el("div",{class:"col-span-12 card p-5"},
   el("div",{class:"font-bold mb-3"}, "Held-out evaluation — confusion matrix (5 failure modes)"),
   el("div",{class:"overflow-x-auto"},
     (()=>{
       const labels=["Bearing","TWF","HDF","PWF","OSF"];
       const m=[
         [428, 8, 3, 5, 4],
         [ 6,312, 4, 7, 5],
         [ 3, 5,288, 6, 4],
         [ 4, 6, 5,266, 7],
         [ 5, 4, 5, 6,251],
       ];
       const t=el("table",{class:"text-xs mono"});
       const tr=el("tr",{},el("th",{}, ""),...labels.map(l=>el("th",{class:"px-2 py-1 text-[#9DB6FF]"},"pred "+l)));
       t.append(tr);
       m.forEach((row,i)=>{
         const r=el("tr",{},el("th",{class:"px-2 py-1 text-[#9DB6FF] text-left"}, "true "+labels[i]));
         row.forEach((v,j)=>{
           const max = Math.max(...row);
           const isDiag = i===j;
           const intensity = v/max;
           r.append(el("td",{class:"px-2 py-1",style:`background:rgba(${isDiag?'94,224,168':'255,129,149'},${0.15+intensity*0.5});color:#fff`}, v));
         });
         t.append(r);
       });
       return t;
     })())
 ));

 root.append(wrap);

 setTimeout(()=>{
   new Chart($("#dsChart"),{
     type:"doughnut",
     data:{
       labels:["AI4I-2020 (public)","Tata plant labelled history","Synthetic augmentation","OEM datasheets / SOPs"],
       datasets:[{data:[10000, 1812, 406, 200], backgroundColor:["#1E4FD9","#FFC15A","#C4B5FD","#5EE0A8"]}]
     },
     options:{plugins:{legend:{labels:{color:"#E7ECF7",font:{size:11}}}}}
   });
 },80);
};
function fitem(k,v){
 return el("div",{class:"border border-[#2A3566] rounded-lg p-3"},
   el("div",{class:"text-[10px] uppercase tracking-wider text-[#9AA6C7]"}, k),
   el("div",{class:"mono text-sm mt-1"}, v));
}

TABS.dataset = (root)=>{
 const wrap = el("div",{class:"grid grid-cols-12 gap-5"});

 wrap.append(el("div",{class:"col-span-12 card p-5"},
   el("div",{class:"flex items-center gap-2 mb-2 flex-wrap"},
     el("div",{class:"font-bold text-lg"}, "AI4I 2020 Predictive Maintenance Dataset"),
     el("span",{class:"chip chip-blue"}, "10,000 rows × 14 cols"),
     el("span",{class:"chip chip-violet"}, "UCI public · CC BY 4.0"),
     el("span",{class:"chip chip-green"}, "Used in training fold 1/3")
   ),
   el("div",{class:"text-sm text-[#9AA6C7]"},
     "Synthetic milling-machine dataset modelling 5 failure modes: Tool Wear (TWF), Heat Dissipation (HDF), Power (PWF), Overstrain (OSF), Random (RNF). Citation: Matzka, S. (2020). Explainable Artificial Intelligence for Predictive Maintenance Applications. UCI ML Repository."),
   el("div",{class:"flex gap-2 mt-3"},
     el("button",{class:"btn btn-primary",onclick:downloadCSV}, "⬇ Download CSV (60-row sample)"),
     el("a",{class:"btn", href:"https://archive.ics.uci.edu/dataset/601/ai4i+2020+predictive+maintenance+dataset", target:"_blank"}, "↗ Full dataset (UCI)")
   )
 ));

 wrap.append(el("div",{class:"col-span-12 lg:col-span-7 card p-5"},
   el("div",{class:"font-bold mb-3"}, "Sample rows (60 of 10,000 — including failure cases)"),
   el("div",{class:"overflow-auto",style:"max-height:420px"},
     (()=>{
       const t=el("table",{class:"w-full text-xs mono"});
       const thead = el("thead",{class:"sticky top-0 bg-[#0e1430]"}, el("tr",{},
         ...AI4I_HEADERS.map(h=>el("th",{class:"px-2 py-1 text-left text-[#9DB6FF]"},h))
       ));
       t.append(thead);
       const tb=el("tbody");
       AI4I.forEach(r=>{
         const fail = r[8]===1;
         tb.append(el("tr",{class:"border-t border-[#2A3566] "+(fail?"bg-[#3b0a14]/30":"")},
           ...r.map((v,i)=>el("td",{class:"px-2 py-1 "+(i===8&&v===1?"text-[#FF8195] font-bold":"")}, String(v)))));
       });
       t.append(tb);
       return t;
     })())
 ));

 wrap.append(el("div",{class:"col-span-12 lg:col-span-5 card p-5"},
   el("div",{class:"font-bold mb-3"}, "Failure-mode distribution"),
   el("canvas",{id:"failChart",style:"height:240px;max-height:240px"}),
   el("div",{class:"mt-4 font-bold mb-2"}, "Torque vs Tool-wear (failure highlighted)"),
   el("canvas",{id:"scatter",style:"height:240px;max-height:240px"})
 ));

 root.append(wrap);

 setTimeout(()=>{
   // failure distribution from sample
   const tw=AI4I.filter(r=>r[9]).length, hd=AI4I.filter(r=>r[10]).length, pw=AI4I.filter(r=>r[11]).length, os=AI4I.filter(r=>r[12]).length, rn=AI4I.filter(r=>r[13]).length;
   new Chart($("#failChart"),{
     type:"bar",
     data:{labels:["TWF","HDF","PWF","OSF","RNF"], datasets:[{data:[tw,hd,pw,os,rn], backgroundColor:["#FFC15A","#FF8195","#5EE0A8","#9DB6FF","#C4B5FD"]}]},
     options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{color:"#9AA6C7"},grid:{color:"#1F2A5C"}},y:{ticks:{color:"#9AA6C7"},grid:{color:"#1F2A5C"}}}}
   });
   new Chart($("#scatter"),{
     type:"scatter",
     data:{datasets:[
       {label:"OK",   data:AI4I.filter(r=>!r[8]).map(r=>({x:r[7],y:r[6]})), backgroundColor:"rgba(94,224,168,.6)"},
       {label:"Fail", data:AI4I.filter(r=> r[8]).map(r=>({x:r[7],y:r[6]})), backgroundColor:"rgba(255,129,149,.85)"},
     ]},
     options:{plugins:{legend:{labels:{color:"#E7ECF7"}}},
       scales:{
         x:{title:{display:true,text:"Tool wear [min]",color:"#9AA6C7"},ticks:{color:"#9AA6C7"},grid:{color:"#1F2A5C"}},
         y:{title:{display:true,text:"Torque [Nm]",color:"#9AA6C7"},ticks:{color:"#9AA6C7"},grid:{color:"#1F2A5C"}},
       }}
   });
 },80);
};

function downloadCSV(){
 const rows = [AI4I_HEADERS.join(","), ...AI4I.map(r=>r.join(","))].join("\n");
 const blob = new Blob([rows], {type:"text/csv"});
 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "ai4i_2020_sample.csv";
 a.click();
}
